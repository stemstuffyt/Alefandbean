<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Job Application - Alef & Bean Coffee</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=The+Seasons&family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="jobapplication.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="brand"><a href="index.html"><img src="headerwhiteback.png" alt="Alef & Bean" class="brand-img"></a></h1>
      <nav class="nav">
        <a href="aboutus.html">About Us</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a href="jobapplication.html">Careers</a>
      </nav>
      <a href="https://www.instagram.com/alefandbean/" class="social-link instagram-link" target="_blank" rel="noopener noreferrer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <circle cx="17.5" cy="6.5" r="1.5"></circle>
        </svg>
      </a>
    </div>
  </header>

  <div class="application-container">
    <div class="form-wrapper">
      <h1>Job Application Form</h1>
      <p class="form-subtitle">Please fill out all required fields</p>

      <form action="https://formspree.io/f/mlgpylnk" method="POST" id="jobApplicationForm">
        
        <!-- Personal Information Section -->
        <fieldset>
          <legend>Personal Information</legend>
          
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name *</label>
              <input type="text" id="lastName" name="lastName" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Email Address *</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="address">Street Address</label>
              <input type="text" id="address" name="address">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city">
            </div>
            <div class="form-group">
              <label for="state">State/Province</label>
              <input type="text" id="state" name="state">
            </div>
            <div class="form-group">
              <label for="zipcode">ZIP/Postal Code</label>
              <input type="text" id="zipcode" name="zipcode">
            </div>
          </div>
        </fieldset>

        <!-- Position Information Section -->
        <fieldset>
          <legend>Position Information</legend>
          
          <div class="form-group">
            <label for="position">Position Applied For *</label>
            <input type="text" id="position" name="position" required>
          </div>

          <div class="form-group">
            <label for="startDate">Available Start Date *</label>
            <input type="date" id="startDate" name="startDate" required>
          </div>

          <div class="form-group">
            <label for="employmentType">Employment Type *</label>
            <select id="employmentType" name="employmentType" required>
              <option value="">Select Employment Type</option>
              <option value="full-time">Full-time</option>
              <option value="part-time">Part-time</option>
              <option value="contract">Contract</option>
              <option value="temporary">Temporary</option>
            </select>
          </div>

          <div class="form-group">
            <label for="salary">Desired Salary Range</label>
            <input type="text" id="salary" name="salary" placeholder="e.g., $50,000 - $60,000">
          </div>
        </fieldset>

        <!-- Education Section -->
        <fieldset>
          <legend>Education</legend>
          
          <div class="form-group">
            <label for="education">Highest Level of Education *</label>
            <select id="education" name="education" required>
              <option value="">Select Education Level</option>
              <option value="high-school">High School/GED</option>
              <option value="associate">Associate Degree</option>
              <option value="bachelor">Bachelor's Degree</option>
              <option value="master">Master's Degree</option>
              <option value="phd">Ph.D.</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="institution">School/University</label>
            <input type="text" id="institution" name="institution">
          </div>

          <div class="form-group">
            <label for="major">Field of Study</label>
            <input type="text" id="major" name="major">
          </div>
        </fieldset>

        <!-- Experience Section -->
        <fieldset>
          <legend>Work Experience</legend>
          
          <div class="form-group">
            <label for="yearsExperience">Years of Relevant Experience *</label>
            <select id="yearsExperience" name="yearsExperience" required>
              <option value="">Select Experience</option>
              <option value="0-1">0-1 years</option>
              <option value="1-3">1-3 years</option>
              <option value="3-5">3-5 years</option>
              <option value="5-10">5-10 years</option>
              <option value="10+">10+ years</option>
            </select>
          </div>

          <div class="form-group">
            <label for="skills">Key Skills *</label>
            <textarea id="skills" name="skills" rows="4" placeholder="List your relevant skills (comma separated)" required></textarea>
          </div>

          <div class="form-group">
            <label for="experience">Professional Experience *</label>
            <textarea id="experience" name="experience" rows="5" placeholder="Describe your relevant professional experience and achievements" required></textarea>
          </div>
        </fieldset>

        <!-- Additional Information Section -->
        <fieldset>
          <legend>Additional Information</legend>
          
          <div class="form-group">
            <label for="coverLetter">Cover Letter</label>
            <textarea id="coverLetter" name="coverLetter" rows="6" placeholder="Tell us why you're interested in this position and what makes you a great fit"></textarea>
          </div>

          <div class="form-group">
            <label for="linkedin">LinkedIn Profile URL</label>
            <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/yourprofile">
          </div>

          <div class="form-group">
            <label for="portfolio">Portfolio/Website URL</label>
            <input type="url" id="portfolio" name="portfolio" placeholder="https://yourportfolio.com">
          </div>

          <div class="form-group checkbox-group">
            <label for="references">
              <input type="checkbox" id="references" name="references">
              References available upon request
            </label>
          </div>

          <div class="form-group checkbox-group">
            <label for="background">
              <input type="checkbox" id="background" name="background">
              I agree to a background check
            </label>
          </div>

          <div class="form-group checkbox-group">
            <label for="terms">
              <input type="checkbox" id="terms" name="terms" required>
              I certify that the information provided is accurate and complete *
            </label>
          </div>
        </fieldset>

        <!-- Form Actions -->
        <div class="form-actions">
          <button type="submit" class="btn-submit">Submit Application</button>
          <button type="reset" class="btn-reset">Clear Form</button>
        </div>
      </form>

      <p class="form-footer">* indicates required fields</p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Alef & Bean — The first letter. The first sip.</p>
    </div>
  </footer>

  <script src="menu.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
